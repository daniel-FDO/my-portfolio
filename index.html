<!doctype html>
<html lang="en" data-page="home">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f4ef" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("portfolio-theme") || "day";
      } catch {
        document.documentElement.dataset.theme = "day";
      }
    </script>
    <meta
      name="description"
      content="Daniel Fasan — front-end developer building useful, playful digital experiences."
    />
    <title>Daniel Fasan — Digital Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,800&family=Geist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="page-shutter" aria-hidden="true"></div>
    <header id="site-header"></header>
    <main id="scene"></main>
    <footer id="site-footer"></footer>
    <div id="project-dialog" class="project-dialog" aria-hidden="true"></div>
    <div class="sound-note" aria-live="polite"></div>
  </body>
</html>
