<!doctype html>
<html lang="en" data-page="home" data-single-page="true">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f4ef" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("portfolio-theme") || "day";
      } catch {
        document.documentElement.dataset.theme = "day";
      }
      document.documentElement.dataset.showIntro = "true";
    </script>
    <meta
      name="description"
      content="Daniel Fasan — front-end developer building useful, playful digital experiences."
    />
    <title>Daniel Fasan — Digital Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,800&family=Geist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
    <script src="./car-scrollbar.js" defer></script>
  </head>
  <body>
    <div class="identity-opening" role="presentation" aria-hidden="true">
      <p class="intro-caption">PORTFOLIO / 2026</p>
      <div class="intro-road" aria-hidden="true"><i></i></div>
      <div class="intro-car" aria-hidden="true"><div class="intro-car-bounce"></div></div>
      <h1 class="intro-name" aria-hidden="true"><span style="--letter-index:0"><i>D</i></span><span style="--letter-index:1"><i>A</i></span><span style="--letter-index:2"><i>N</i></span><span style="--letter-index:3"><i>I</i></span><span style="--letter-index:4"><i>E</i></span><span style="--letter-index:5"><i>L</i></span><span class="intro-space" style="--letter-index:6"><i>&nbsp;</i></span><span style="--letter-index:7"><i>F</i></span><span style="--letter-index:8"><i>A</i></span><span style="--letter-index:9"><i>S</i></span><span style="--letter-index:10"><i>A</i></span><span style="--letter-index:11"><i>N</i></span><span class="intro-accent" style="--letter-index:12"><i>.</i></span></h1>
      <p class="intro-subtitle">Front-end developer / Building useful, playful digital experiences.</p>
      <p class="intro-counter" aria-hidden="true"><span>000</span><i>%</i></p>
      <button class="intro-skip" type="button">Skip intro</button>
    </div>
    <header id="site-header"></header>
    <main id="scene"></main>
    <footer id="site-footer"></footer>
    <div id="project-dialog" class="project-dialog" aria-hidden="true"></div>
    <div class="sound-note" aria-live="polite"></div>
  </body>
</html>
